title: Tutorial for the Preparation of Enzyme QM/MM Systems for CP2K
description: From a tleap topology to a steered QM/MM MD run in which bonds form and break, and a Jarzynski work profile (Amber/GLYCAM force fields, CP2K)
author: Alexandre V. Pinto
lang: en
image: /assets/img/CP2K_PREP_TUTORIAL.png

# Shown at the top of the main page of the tutorial.
topic: QM/MM
topic_color: "#ff5257"
series: Part 1 of Enzyme QM/MM with CP2K
tools: [AmberTools, ParmEd, VMD, CP2K, Python]
next_tutorial:
  title: Static QM/MM (TS searches with CI-NEB and the dimer method)
  url: https://arvpinto.github.io/enzyme_neb_cp2k/

# Pages of the tutorial, in reading order. They build the "Sections" menu and
# the Previous / Next links at the bottom of every page.
sections:
  - title: Overview
    url: /
  - num: I
    title: System setup
    url: /enzyme_qmmm_prep_I.html
  - num: II
    title: QM region
    url: /enzyme_qmmm_prep_II.html
  - num: III
    title: QM/MM include files
    url: /enzyme_qmmm_prep_III.html
  - num: IV
    title: Charge correction
    url: /enzyme_qmmm_prep_IV.html
  - num: V
    title: MM minimization
    url: /enzyme_qmmm_prep_V.html
  - num: VI
    title: QM/MM minimization
    url: /enzyme_qmmm_prep_VI.html
  - num: VII
    title: QM/MM MD
    url: /enzyme_qmmm_prep_VII.html
  - num: VIII
    title: Steered QM/MM MD
    url: /enzyme_qmmm_prep_VIII.html

# Main site (CompBioChem Tutorials) and this repository.
home_url: https://arvpinto.github.io/
repo_url: https://github.com/arvpinto/enzyme_qmmm_prep_cp2k

# The pages use their own layout and stylesheet (no remote theme), matching the main site.
plugins:
  - jekyll-seo-tag

# Input files, outputs and scripts are linked from the pages on GitHub; they are not part of the site.
exclude:
  - system_prep
  - mm_em
  - qmmm_em
  - qmmm_md_eq
  - qmmm_md_smd
  - scripts
  - LICENSE
